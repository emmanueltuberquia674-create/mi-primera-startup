<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.nombre_sistema }} | Dashboard</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131c2e;
            --bg-input: #070a12;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        /* Encabezado con Logo */
        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .logo-box {
            font-size: 28px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* Barra de Métricas Dorada */
        .metrics-bar {
            display: flex;
            background: linear-gradient(180deg, #1e293b 0%, #131c2e 100%);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
        }
        .metric-card {
            width: 50%;
            text-align: center;
        }
        .metric-card:first-child {
            border-right: 1px solid var(--border);
        }
        .metric-val {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-main);
        }
        .metric-val.gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .metric-lbl {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .status-badge {
            background: #10b981;
            color: #0b0f19;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
            vertical-align: middle;
        }

        /* LAYOUT DE DOS COLUMNAS */
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        /* Columna Izquierda: Operaciones */
        .panel-left {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-section {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-group { margin-bottom: 15px; }
        .form-group-inline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        label { display: block; color: var(--text-main); font-size: 14px; }
        .add-link { color: var(--gold); font-size: 12px; text-decoration: none; }
        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus { border-color: var(--gold); outline: none; }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        button.btn-submit:hover { opacity: 0.9; }

        /* Lista de Posiciones Activas */
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .user-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .user-card.vip-card {
            border-left: 4px solid var(--gold);
            box-shadow: inset 5px 0 20px rgba(212, 175, 55, 0.05);
        }
        .user-card.standard-card {
            border-left: 4px solid #38bdf8;
        }

        .card-info h3 { margin: 0 0 5px 0; font-size: 18px; }
        .card-info .meta-rol { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; }
        .card-details-grid {
            display: grid;
            grid-template-columns: 140px 140px;
            gap: 10px;
            margin-top: 12px;
            font-size: 12px;
        }
        .detail-lbl { color: var(--text-muted); }
        .detail-val { color: var(--text-main); font-weight: 500; }
        .detail-val.active-green { color: #10b981; }

        .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            height: 80px;
        }
        .card-price { font-size: 22px; font-weight: bold; }
        .card-actions { display: flex; gap: 8px; }
        .btn-edit-opt { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-delete-opt { background: #ef4444; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        .tag-vip { background: var(--gold-gradient); color: #000; font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 3px; margin-left: 5px; }
        .tag-partner { border: 1px solid var(--gold); color: var(--gold); font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 3px; margin-left: 3px; }

        /* Columna Derecha: Insights Lateral */
        .panel-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .sidebar-box h4 { margin: 0 0 15px 0; font-size: 14px; color: var(--text-main); letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .insight-text { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
        .insight-highlight { color: var(--text-main); font-weight: 500; }
        
        .sidebar-link { display: block; color: var(--text-muted); font-size: 13px; text-decoration: none; padding: 8px 0; border-bottom: 1px dashed #1e293b; }
        .sidebar-link:hover { color: var(--gold); }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    
    <div class="header-brand">
        <div class="logo-box">{{ config.nombre_sistema[:2].upper() }}</div>
        <div style="font-size: 14px; color: var(--text-muted); font-weight: 500; margin-top: 5px;">{{ config.nombre_sistema }} - {{ config.mensaje_bienvenida }}</div>
    </div>

    <div class="metrics-bar">
        <div class="metric-card">
            <div class="metric-val"><span id="metricTotal">0</span> <span class="status-badge">Active</span></div>
            <div class="metric-lbl">ACTIVE PORTFOLIOS</div>
        </div>
        <div class="metric-card">
            <div id="metricCapital" class="metric-val gold-text">{{ config.simbolo_moneda }}0{{ config.moneda }}</div>
            <div class="metric-lbl">CAPITAL DEPLOYED</div>
        </div>
    </div>

    <div class="main-layout">
        
        <div class="panel-left">
            <div class="form-section">
                <form id="formularioUsuario">
                    <div class="form-group">
                        <div class="form-group-inline">
                            <label>Nombre Completo:</label>
                            <a href="#" class="add-link">+ Add New Entry</a>
                        </div>
                        <input type="text" id="nombre" required placeholder="Ej. Juan Solis">
                    </div>
                    <div class="form-group">
                        <div class="form-group-inline">
                            <label>Rol Estratégico:</label>
                        </div>
                        <input type="text" id="rol" required placeholder="Ej. Inversionista">
                    </div>
                    <div class="
